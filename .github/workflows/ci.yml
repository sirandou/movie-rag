name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Pin setuptools for legacy CLIP build
        # openai/CLIP's setup.py imports pkg_resources, which setuptools 81+
        # no longer exposes in PEP-517 build-isolation environments. Pinning
        # setuptools < 81 via pip constraint lets the isolated build env
        # satisfy the import without affecting the runtime venv.
        run: echo "setuptools<81" > ${{ runner.temp }}/constraints.txt

      - name: Install dependencies
        env:
          PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
        run: poetry install --with dev

      - name: Run tests
        run: poetry run make test
