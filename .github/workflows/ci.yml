name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Bootstrap venv and install CLIP without build isolation
        # openai/CLIP's setup.py imports pkg_resources, which setuptools 81+
        # no longer exposes in PEP-517 build-isolation environments. We
        # create the venv, install setuptools<81 + wheel into it, then
        # install CLIP with --no-build-isolation so its setup.py sees
        # pkg_resources from the venv. Poetry's later install step sees
        # CLIP already satisfied and skips the failing wheel build.
        run: |
          poetry env use python
          poetry run python -m pip install "setuptools<81" wheel
          poetry run python -m pip install --no-build-isolation \
            "clip @ git+https://github.com/openai/CLIP.git"

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run make test
